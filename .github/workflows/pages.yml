# A cada push na main: gera o quadro em modo demo (backend no navegador)
# e o mapa do repositório com o graphify (só AST, sem LLM e sem chave),
# e publica os dois no GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # Variável do repositório (Settings → Secrets and variables → Actions → Variables).
          # Com ela o Pages usa o backend online compartilhado; sem ela, o modo demo no navegador.
          VITE_API_URL: ${{ vars.UAILLO_API_URL }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mapa do repositório (graphify)
        run: |
          pip install graphifyy==0.9.92
          graphify update .
          mkdir -p dist/graph
          cp graphify-out/graph.html dist/graph/index.html
          cp graphify-out/GRAPH_REPORT.md dist/graph/GRAPH_REPORT.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
